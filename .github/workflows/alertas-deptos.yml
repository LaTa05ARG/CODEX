name: Alertas de departamentos

on:
  schedule:
    # Cada 30 minutos (GitHub puede demorar las corridas programadas unos minutos).
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      probar_mail:
        description: "Mandar un mail de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alertas-deptos
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar avisos nuevos y mandar mails
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PROBAR_MAIL: ${{ inputs.probar_mail }}
        run: python -m alertas $([ "$PROBAR_MAIL" = "true" ] && echo --probar-mail)

      # Se guarda aunque el paso anterior falle, para no re-notificar lo ya enviado.
      - name: Guardar avisos vistos
        if: always()
        run: |
          [ -f data/vistos.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vistos.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar avisos vistos [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

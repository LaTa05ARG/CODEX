# Configuración de alertas de departamentos.
#
# Cada búsqueda combina:
#   1. `urls`: búsquedas de MercadoLibre y/o Zonaprop. Lo más fácil es armar la
#      búsqueda en la web con los filtros del sitio y pegar la URL acá.
#      - Zonaprop: ordená por "Más recientes" (la URL termina en
#        "-orden-publicado-descendente.html") para que lo nuevo quede arriba.
#      - MercadoLibre: agregá el filtro "Publicados hoy" (`_PublishedToday_YES`
#        en la URL), porque el sitio no ordena por fecha.
#      - Si pegás una URL en vista de mapa, se convierte sola a vista de lista.
#   2. `filtros`: condiciones extra que se revisan sobre cada aviso antes de
#      mandar el mail. Todos son opcionales; borrá los que no uses.
#
# Si a un aviso le falta un dato (p. ej. no informa m²), ese filtro no lo
# descarta. Los textos se comparan sin importar mayúsculas ni tildes.

opciones:
  paginas: 2                          # páginas de resultados a revisar por URL
  un_mail_por_aviso: true             # false = un solo mail por búsqueda con todos los nuevos
  notificar_en_primera_corrida: false # la 1ª vez solo registra lo que ya está publicado

busquedas:
  # MercadoLibre: toda CABA con los filtros del sitio (venta, apto crédito, 3+ dormitorios,
  # 1+ cochera, hasta USD 400.000, publicados hoy). Los barrios se filtran con
  # `ubicacion_incluye` porque MercadoLibre trata Belgrano R/C, Palermo Soho/Chico,
  # Barrio Norte, Las Cañitas, etc. como barrios aparte.
  - nombre: Venta 3 dorm ML
    urls:
      - https://inmuebles.mercadolibre.com.ar/departamentos/venta/apto-credito/mas-de-3-dormitorios/capital-federal/_PriceRange_0USD-400000USD_PublishedToday_YES_NoIndex_True_PARKING*LOTS_1-*
    filtros:
      precio_max: {USD: 400000}
      dormitorios_min: 3
      ubicacion_incluye: [Belgrano, Palermo, Recoleta, Barrio Norte, Las Cañitas]

  # Zonaprop: la URL ya filtra barrios (Belgrano, Palermo, Recoleta), apto crédito, 3+ dormitorios,
  # 1+ cochera, hasta USD 400.000 y publicados hace menos de 2 días (no se pierde nada a medianoche).
  - nombre: Venta 3 dorm Zonaprop
    urls:
      - https://www.zonaprop.com.ar/departamentos-venta-belgrano-palermo-recoleta-con-apto-credito-mas-de-3-habitaciones-mas-de-1-garage-publicado-hace-menos-de-2-dias-menos-400000-dolar.html
    filtros:
      precio_max: {USD: 400000}
      dormitorios_min: 3

# Otros filtros disponibles: precio_min, aceptar_sin_precio, expensas_max, ambientes_min/max,
# dormitorios_max, banos_min, m2_min/max, palabras_requeridas, palabras_excluidas.
